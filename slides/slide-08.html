<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 720pt;
      height: 405pt;
      font-family: 'Pretendard', sans-serif;
      background: #0f0f0f;
      padding: 32pt 48pt;
      display: flex;
      flex-direction: column;
    }
  </style>
</head>
<body>
  <!-- Header -->
  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24pt;">
    <div style="display: flex; align-items: center; gap: 12pt;">
      <p style="display: inline-block; padding: 4pt 10pt; background: #22c55e; color: #fff; border-radius: 4pt; font-size: 8pt; font-weight: 600;">SECTION 06</p>
      <h2 style="font-size: 22pt; font-weight: 600; color: #ffffff; word-break: keep-all;">기대 효과</h2>
    </div>
    <p style="font-size: 10pt; color: #666;">08</p>
  </div>

  <!-- Benefits Grid -->
  <div style="flex: 1; display: grid; grid-template-columns: repeat(3, 1fr); gap: 18pt;">
    <!-- Benefit 1: Learning Outcomes -->
    <div style="background: linear-gradient(180deg, rgba(34,197,94,0.15) 0%, rgba(34,197,94,0.05) 100%); border-radius: 12pt; padding: 20pt; border: 1px solid rgba(34,197,94,0.3); display: flex; flex-direction: column; justify-content: space-between;">
      <div>
        <p style="font-size: 9pt; color: #22c55e; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12pt;">학습 성과</p>
        <p style="font-size: 42pt; font-weight: 700; color: #ffffff; letter-spacing: -0.02em;">+40%</p>
      </div>
      <div>
        <h3 style="font-size: 13pt; font-weight: 600; color: #ffffff; margin-bottom: 6pt; word-break: keep-all;">학습 효율 향상</h3>
        <p style="font-size: 10pt; color: #888; line-height: 1.5; word-break: keep-all;">개인화된 학습 경로로 동일 시간 대비 학습 성취도 증가</p>
      </div>
    </div>

    <!-- Benefit 2: Teacher Efficiency -->
    <div style="background: linear-gradient(180deg, rgba(59,130,246,0.15) 0%, rgba(59,130,246,0.05) 100%); border-radius: 12pt; padding: 20pt; border: 1px solid rgba(59,130,246,0.3); display: flex; flex-direction: column; justify-content: space-between;">
      <div>
        <p style="font-size: 9pt; color: #3b82f6; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12pt;">교사 효율</p>
        <p style="font-size: 42pt; font-weight: 700; color: #ffffff; letter-spacing: -0.02em;">-60%</p>
      </div>
      <div>
        <h3 style="font-size: 13pt; font-weight: 600; color: #ffffff; margin-bottom: 6pt; word-break: keep-all;">행정 업무 감소</h3>
        <p style="font-size: 10pt; color: #888; line-height: 1.5; word-break: keep-all;">자동화된 평가와 리포트로 교사가 교육에 집중</p>
      </div>
    </div>

    <!-- Benefit 3: Engagement -->
    <div style="background: linear-gradient(180deg, rgba(168,85,247,0.15) 0%, rgba(168,85,247,0.05) 100%); border-radius: 12pt; padding: 20pt; border: 1px solid rgba(168,85,247,0.3); display: flex; flex-direction: column; justify-content: space-between;">
      <div>
        <p style="font-size: 9pt; color: #a855f7; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12pt;">학습 참여</p>
        <p style="font-size: 42pt; font-weight: 700; color: #ffffff; letter-spacing: -0.02em;">85%</p>
      </div>
      <div>
        <h3 style="font-size: 13pt; font-weight: 600; color: #ffffff; margin-bottom: 6pt; word-break: keep-all;">학습 지속률</h3>
        <p style="font-size: 10pt; color: #888; line-height: 1.5; word-break: keep-all;">맞춤형 콘텐츠와 게이미피케이션으로 중도 포기율 감소</p>
      </div>
    </div>
  </div>

  <!-- Bottom Summary -->
  <div style="display: flex; gap: 24pt; padding-top: 18pt; border-top: 1px solid rgba(255,255,255,0.1); margin-top: 18pt;">
    <div style="flex: 1; display: flex; align-items: center; gap: 10pt;">
      <div style="width: 8pt; height: 8pt; background: #22c55e; border-radius: 50%;"></div>
      <p style="font-size: 10pt; color: #b0b0b0; word-break: keep-all;">비용 효율적인 대규모 교육 제공</p>
    </div>
    <div style="flex: 1; display: flex; align-items: center; gap: 10pt;">
      <div style="width: 8pt; height: 8pt; background: #3b82f6; border-radius: 50%;"></div>
      <p style="font-size: 10pt; color: #b0b0b0; word-break: keep-all;">교육 격차 해소 및 접근성 향상</p>
    </div>
    <div style="flex: 1; display: flex; align-items: center; gap: 10pt;">
      <div style="width: 8pt; height: 8pt; background: #a855f7; border-radius: 50%;"></div>
      <p style="font-size: 10pt; color: #b0b0b0; word-break: keep-all;">데이터 기반 교육 정책 수립 지원</p>
    </div>
  </div>
</body>
</html>
