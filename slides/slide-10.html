<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 720pt;
      height: 405pt;
      font-family: 'Pretendard', sans-serif;
      background: #0f0f0f;
      position: relative;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <!-- Background Image -->
  <img src="https://images.unsplash.com/photo-1517245386807-bb43f82c33c4?w=1400&q=80" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0.2;">
  <div style="position: absolute; inset: 0; background: linear-gradient(135deg, rgba(15,15,15,0.95) 0%, rgba(59,130,246,0.15) 100%);"></div>

  <!-- Content -->
  <div style="position: relative; z-index: 1; width: 100%; height: 100%; padding: 40pt 48pt; display: flex; flex-direction: column; justify-content: space-between;">
    <!-- Logo -->
    <div style="display: flex; align-items: center; gap: 8pt;">
      <div style="width: 20pt; height: 20pt; background: #ffffff; border-radius: 4pt; display: flex; align-items: center; justify-content: center;">
        <p style="color: #0f0f0f; font-size: 10pt; font-weight: 700;">AI</p>
      </div>
      <p style="font-size: 12pt; font-weight: 600; color: #ffffff;">EduTech Platform</p>
    </div>

    <!-- Main Message -->
    <div>
      <p style="display: inline-block; padding: 4pt 12pt; background: #3b82f6; color: #fff; border-radius: 4pt; font-size: 9pt; font-weight: 600; margin-bottom: 20pt;">CONCLUSION</p>
      <h1 style="font-size: 42pt; font-weight: 600; color: #ffffff; letter-spacing: -0.02em; line-height: 1.2; margin-bottom: 20pt; word-break: keep-all;">
        AI로 여는<br>교육의 새로운 미래
      </h1>
      <p style="font-size: 14pt; color: #b0b0b0; line-height: 1.7; max-width: 420pt; word-break: keep-all;">
        AI 기반 교육 플랫폼은 개인화된 학습 경험을 통해 모든 학습자가 자신의 잠재력을 최대한 발휘할 수 있는 환경을 제공합니다.
      </p>
      <div style="display: flex; gap: 14pt; margin-top: 24pt;">
        <div style="display: flex; align-items: center; gap: 8pt; padding: 8pt 16pt; background: rgba(255,255,255,0.1); border-radius: 20pt;">
          <p style="font-size: 11pt; color: #ffffff; font-weight: 500; word-break: keep-all;">지금 시작하세요</p>
          <p style="font-size: 12pt; color: #3b82f6;">-></p>
        </div>
      </div>
    </div>

    <!-- Contact Info -->
    <div style="display: flex; gap: 48pt;">
      <div>
        <p style="font-size: 9pt; color: #666; margin-bottom: 4pt;">Email</p>
        <p style="font-size: 11pt; font-weight: 500; color: #ffffff;">contact@edutech.ai</p>
      </div>
      <div>
        <p style="font-size: 9pt; color: #666; margin-bottom: 4pt;">Website</p>
        <p style="font-size: 11pt; font-weight: 500; color: #ffffff;">www.edutech-platform.ai</p>
      </div>
      <div>
        <p style="font-size: 9pt; color: #666; margin-bottom: 4pt;">Phone</p>
        <p style="font-size: 11pt; font-weight: 500; color: #ffffff;">+82 02-1234-5678</p>
      </div>
    </div>
  </div>
</body>
</html>
