<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 720pt;
      height: 405pt;
      font-family: 'Pretendard', sans-serif;
      background: #0f0f0f;
      position: relative;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <!-- Background Image -->
  <img src="https://images.unsplash.com/photo-1674027215016-0a4abfdbf1cc?w=1400&q=80" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0.15;">
  <div style="position: absolute; inset: 0; background: linear-gradient(135deg, rgba(15,15,15,0.95) 0%, rgba(59,130,246,0.1) 100%);"></div>

  <!-- Content -->
  <div style="position: relative; z-index: 1; width: 100%; height: 100%; padding: 32pt 48pt; display: flex; flex-direction: column;">
    <!-- Header -->
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24pt;">
      <div style="display: flex; align-items: center; gap: 12pt;">
        <p style="display: inline-block; padding: 4pt 10pt; background: #22c55e; color: #fff; border-radius: 4pt; font-size: 8pt; font-weight: 600;">SECTION 03</p>
        <h2 style="font-size: 22pt; font-weight: 600; color: #ffffff; word-break: keep-all;">AI 기반 솔루션</h2>
      </div>
      <p style="font-size: 10pt; color: #666;">05</p>
    </div>

    <!-- Solution Overview -->
    <div style="flex: 1; display: grid; grid-template-columns: 1.2fr 1fr; gap: 32pt; align-items: center;">
      <!-- Left: Main Solution -->
      <div>
        <h3 style="font-size: 28pt; font-weight: 600; color: #ffffff; line-height: 1.3; margin-bottom: 18pt; word-break: keep-all;">
          학습자 중심의<br>적응형 교육 플랫폼
        </h3>
        <p style="font-size: 12pt; color: #b0b0b0; line-height: 1.7; margin-bottom: 20pt; word-break: keep-all;">
          AI가 학습자의 성향, 진도, 이해도를 실시간 분석하여 최적화된 학습 경로와 콘텐츠를 제공합니다.
        </p>
        <div style="display: flex; gap: 12pt;">
          <div style="display: flex; align-items: center; gap: 6pt; padding: 6pt 12pt; background: rgba(34,197,94,0.15); border-radius: 16pt;">
            <div style="width: 6pt; height: 6pt; background: #22c55e; border-radius: 50%;"></div>
            <p style="font-size: 10pt; color: #22c55e; font-weight: 500;">개인화</p>
          </div>
          <div style="display: flex; align-items: center; gap: 6pt; padding: 6pt 12pt; background: rgba(59,130,246,0.15); border-radius: 16pt;">
            <div style="width: 6pt; height: 6pt; background: #3b82f6; border-radius: 50%;"></div>
            <p style="font-size: 10pt; color: #3b82f6; font-weight: 500;">실시간 분석</p>
          </div>
          <div style="display: flex; align-items: center; gap: 6pt; padding: 6pt 12pt; background: rgba(168,85,247,0.15); border-radius: 16pt;">
            <div style="width: 6pt; height: 6pt; background: #a855f7; border-radius: 50%;"></div>
            <p style="font-size: 10pt; color: #a855f7; font-weight: 500;">자동화</p>
          </div>
        </div>
      </div>

      <!-- Right: Solution Components -->
      <div style="display: flex; flex-direction: column; gap: 12pt;">
        <div style="background: rgba(255,255,255,0.05); border-radius: 10pt; padding: 14pt 16pt; border: 1px solid rgba(255,255,255,0.1); display: flex; align-items: center; gap: 14pt;">
          <div style="width: 40pt; height: 40pt; background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%); border-radius: 8pt; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
            <p style="font-size: 16pt; color: #fff;">ML</p>
          </div>
          <div>
            <h4 style="font-size: 12pt; font-weight: 600; color: #ffffff; margin-bottom: 4pt; word-break: keep-all;">머신러닝 추천 엔진</h4>
            <p style="font-size: 10pt; color: #888; word-break: keep-all;">학습 패턴 분석 기반 콘텐츠 추천</p>
          </div>
        </div>

        <div style="background: rgba(255,255,255,0.05); border-radius: 10pt; padding: 14pt 16pt; border: 1px solid rgba(255,255,255,0.1); display: flex; align-items: center; gap: 14pt;">
          <div style="width: 40pt; height: 40pt; background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%); border-radius: 8pt; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
            <p style="font-size: 14pt; color: #fff;">NLP</p>
          </div>
          <div>
            <h4 style="font-size: 12pt; font-weight: 600; color: #ffffff; margin-bottom: 4pt; word-break: keep-all;">자연어 처리 튜터</h4>
            <p style="font-size: 10pt; color: #888; word-break: keep-all;">24시간 질의응답 및 학습 지원</p>
          </div>
        </div>

        <div style="background: rgba(255,255,255,0.05); border-radius: 10pt; padding: 14pt 16pt; border: 1px solid rgba(255,255,255,0.1); display: flex; align-items: center; gap: 14pt;">
          <div style="width: 40pt; height: 40pt; background: linear-gradient(135deg, #a855f7 0%, #7c3aed 100%); border-radius: 8pt; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
            <p style="font-size: 16pt; color: #fff;">CV</p>
          </div>
          <div>
            <h4 style="font-size: 12pt; font-weight: 600; color: #ffffff; margin-bottom: 4pt; word-break: keep-all;">컴퓨터 비전 평가</h4>
            <p style="font-size: 10pt; color: #888; word-break: keep-all;">필기 및 행동 분석 기반 평가</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
