<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 720pt;
      height: 405pt;
      font-family: 'Pretendard', sans-serif;
      background: #0f0f0f;
      padding: 40pt 48pt;
      display: grid;
      grid-template-columns: 1fr 1.6fr;
      gap: 48pt;
    }
  </style>
</head>
<body>
  <!-- Left: Title -->
  <div style="display: flex; flex-direction: column; justify-content: space-between;">
    <div>
      <p style="font-size: 9pt; color: #666; margin-bottom: 20pt;">AI EDUCATION PLATFORM</p>
      <h1 style="font-size: 42pt; font-weight: 600; color: #ffffff; letter-spacing: -0.02em; line-height: 1.15; word-break: keep-all;">
        목차
      </h1>
      <p style="font-size: 13pt; color: #888; margin-top: 16pt; line-height: 1.6; word-break: keep-all;">
        AI 기반 교육 플랫폼의<br>핵심 내용을 살펴봅니다
      </p>
    </div>
    <div style="width: 32pt; height: 32pt; border: 1px solid #3b82f6; border-radius: 50%; display: flex; align-items: center; justify-content: center;">
      <p style="font-size: 14pt; color: #3b82f6;">|</p>
    </div>
  </div>

  <!-- Right: Contents List -->
  <div style="display: flex; flex-direction: column; justify-content: center; gap: 10pt;">
    <div style="display: flex; align-items: center; gap: 14pt; padding: 10pt 0; border-bottom: 1px solid rgba(255,255,255,0.1);">
      <p style="display: inline-block; padding: 4pt 10pt; background: #3b82f6; color: #fff; border-radius: 4pt; font-size: 8pt; font-weight: 600;">01</p>
      <p style="flex: 1; font-size: 13pt; font-weight: 500; color: #ffffff; word-break: keep-all;">왜 AI 교육인가?</p>
    </div>
    <div style="display: flex; align-items: center; gap: 14pt; padding: 10pt 0; border-bottom: 1px solid rgba(255,255,255,0.1);">
      <p style="display: inline-block; padding: 4pt 10pt; background: #3b82f6; color: #fff; border-radius: 4pt; font-size: 8pt; font-weight: 600;">02</p>
      <p style="flex: 1; font-size: 13pt; font-weight: 500; color: #ffffff; word-break: keep-all;">현재 교육의 한계</p>
    </div>
    <div style="display: flex; align-items: center; gap: 14pt; padding: 10pt 0; border-bottom: 1px solid rgba(255,255,255,0.1);">
      <p style="display: inline-block; padding: 4pt 10pt; background: #3b82f6; color: #fff; border-radius: 4pt; font-size: 8pt; font-weight: 600;">03</p>
      <p style="flex: 1; font-size: 13pt; font-weight: 500; color: #ffffff; word-break: keep-all;">AI 기반 솔루션</p>
    </div>
    <div style="display: flex; align-items: center; gap: 14pt; padding: 10pt 0; border-bottom: 1px solid rgba(255,255,255,0.1);">
      <p style="display: inline-block; padding: 4pt 10pt; background: #3b82f6; color: #fff; border-radius: 4pt; font-size: 8pt; font-weight: 600;">04</p>
      <p style="flex: 1; font-size: 13pt; font-weight: 500; color: #ffffff; word-break: keep-all;">핵심 기능</p>
    </div>
    <div style="display: flex; align-items: center; gap: 14pt; padding: 10pt 0; border-bottom: 1px solid rgba(255,255,255,0.1);">
      <p style="display: inline-block; padding: 4pt 10pt; background: #3b82f6; color: #fff; border-radius: 4pt; font-size: 8pt; font-weight: 600;">05</p>
      <p style="flex: 1; font-size: 13pt; font-weight: 500; color: #ffffff; word-break: keep-all;">기술 아키텍처</p>
    </div>
    <div style="display: flex; align-items: center; gap: 14pt; padding: 10pt 0; border-bottom: 1px solid rgba(255,255,255,0.1);">
      <p style="display: inline-block; padding: 4pt 10pt; background: #3b82f6; color: #fff; border-radius: 4pt; font-size: 8pt; font-weight: 600;">06</p>
      <p style="flex: 1; font-size: 13pt; font-weight: 500; color: #ffffff; word-break: keep-all;">기대 효과</p>
    </div>
    <div style="display: flex; align-items: center; gap: 14pt; padding: 10pt 0; border-bottom: 1px solid rgba(255,255,255,0.1);">
      <p style="display: inline-block; padding: 4pt 10pt; background: #3b82f6; color: #fff; border-radius: 4pt; font-size: 8pt; font-weight: 600;">07</p>
      <p style="flex: 1; font-size: 13pt; font-weight: 500; color: #ffffff; word-break: keep-all;">구현 고려사항</p>
    </div>
    <div style="display: flex; align-items: center; gap: 14pt; padding: 10pt 0;">
      <p style="display: inline-block; padding: 4pt 10pt; background: #3b82f6; color: #fff; border-radius: 4pt; font-size: 8pt; font-weight: 600;">08</p>
      <p style="flex: 1; font-size: 13pt; font-weight: 500; color: #ffffff; word-break: keep-all;">결론</p>
    </div>
  </div>
</body>
</html>
