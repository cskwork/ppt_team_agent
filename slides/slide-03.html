<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 720pt;
      height: 405pt;
      font-family: 'Pretendard', sans-serif;
      background: #0f0f0f;
      position: relative;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <!-- Background Image -->
  <img src="https://images.unsplash.com/photo-1519389950473-47ba0277781c?w=1400&q=80" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0.2;">
  <div style="position: absolute; inset: 0; background: linear-gradient(to right, rgba(15,15,15,0.95) 0%, rgba(15,15,15,0.8) 100%);"></div>

  <!-- Content -->
  <div style="position: relative; z-index: 1; width: 100%; height: 100%; padding: 32pt 48pt; display: flex; flex-direction: column;">
    <!-- Header -->
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24pt;">
      <div style="display: flex; align-items: center; gap: 12pt;">
        <p style="display: inline-block; padding: 4pt 10pt; background: #3b82f6; color: #fff; border-radius: 4pt; font-size: 8pt; font-weight: 600;">SECTION 01</p>
        <h2 style="font-size: 22pt; font-weight: 600; color: #ffffff; word-break: keep-all;">왜 AI 교육인가?</h2>
      </div>
      <p style="font-size: 10pt; color: #666;">03</p>
    </div>

    <!-- Main Content -->
    <div style="flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 24pt; align-items: center;">
      <!-- Left: Stats -->
      <div style="display: flex; flex-direction: column; gap: 16pt;">
        <div style="background: rgba(255,255,255,0.05); border-radius: 10pt; padding: 18pt; border: 1px solid rgba(255,255,255,0.1);">
          <p style="font-size: 9pt; color: #3b82f6; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8pt;">글로벌 에듀테크 시장</p>
          <p style="font-size: 36pt; font-weight: 700; color: #ffffff; letter-spacing: -0.02em;">$404B</p>
          <p style="font-size: 10pt; color: #888; margin-top: 6pt;">2025년 예상 시장 규모</p>
        </div>
        <div style="background: rgba(255,255,255,0.05); border-radius: 10pt; padding: 18pt; border: 1px solid rgba(255,255,255,0.1);">
          <p style="font-size: 9pt; color: #22c55e; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8pt;">AI 교육 도입률</p>
          <p style="font-size: 36pt; font-weight: 700; color: #ffffff; letter-spacing: -0.02em;">47%</p>
          <p style="font-size: 10pt; color: #888; margin-top: 6pt;">교육기관 AI 도입 증가율</p>
        </div>
      </div>

      <!-- Right: Key Points -->
      <div style="display: flex; flex-direction: column; gap: 14pt;">
        <div style="padding-left: 14pt; border-left: 2pt solid #3b82f6;">
          <h3 style="font-size: 14pt; font-weight: 600; color: #ffffff; margin-bottom: 6pt; word-break: keep-all;">개인화된 학습 경험</h3>
          <p style="font-size: 11pt; color: #888; line-height: 1.6; word-break: keep-all;">AI가 학습자 수준과 속도에 맞춘 맞춤형 콘텐츠 제공</p>
        </div>
        <div style="padding-left: 14pt; border-left: 2pt solid #22c55e;">
          <h3 style="font-size: 14pt; font-weight: 600; color: #ffffff; margin-bottom: 6pt; word-break: keep-all;">실시간 피드백</h3>
          <p style="font-size: 11pt; color: #888; line-height: 1.6; word-break: keep-all;">즉각적인 평가와 개선점 제시로 학습 효율 극대화</p>
        </div>
        <div style="padding-left: 14pt; border-left: 2pt solid #a855f7;">
          <h3 style="font-size: 14pt; font-weight: 600; color: #ffffff; margin-bottom: 6pt; word-break: keep-all;">확장 가능한 교육</h3>
          <p style="font-size: 11pt; color: #888; line-height: 1.6; word-break: keep-all;">물리적 제약 없이 대규모 학습자에게 양질의 교육 제공</p>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <div style="display: flex; justify-content: flex-end; padding-top: 12pt;">
      <p style="font-size: 9pt; color: #666;">Source: HolonIQ, UNESCO 2024</p>
    </div>
  </div>
</body>
</html>
