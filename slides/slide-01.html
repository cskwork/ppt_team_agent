<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 720pt;
      height: 405pt;
      font-family: 'Pretendard', sans-serif;
      background: #0f0f0f;
      position: relative;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <!-- Background Image -->
  <img src="https://images.unsplash.com/photo-1677442136019-21780ecad995?w=1400&q=80" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0.25;">
  <div style="position: absolute; inset: 0; background: linear-gradient(135deg, rgba(15,15,15,0.9) 0%, rgba(15,15,15,0.7) 100%);"></div>

  <!-- Content -->
  <div style="position: relative; z-index: 1; width: 100%; height: 100%; padding: 32pt 48pt; display: flex; flex-direction: column;">
    <!-- Header -->
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <div style="display: flex; align-items: center; gap: 12pt;">
        <div style="width: 18pt; height: 18pt; background: #ffffff; border-radius: 4pt; display: flex; align-items: center; justify-content: center;">
          <p style="color: #0f0f0f; font-size: 10pt; font-weight: 700;">AI</p>
        </div>
        <p style="font-size: 11pt; font-weight: 600; color: #ffffff;">EduTech Platform</p>
      </div>
      <p style="display: inline-block; padding: 4pt 12pt; border: 1px solid rgba(255,255,255,0.3); border-radius: 12pt; font-size: 9pt; font-weight: 500; color: rgba(255,255,255,0.8);">PRESENTATION</p>
    </div>

    <!-- Main Title -->
    <div style="flex: 1; display: flex; flex-direction: column; justify-content: center;">
      <p style="font-size: 12pt; color: #3b82f6; font-weight: 600; letter-spacing: 0.1em; margin-bottom: 16pt;">NEXT-GENERATION LEARNING</p>
      <h1 style="font-size: 48pt; font-weight: 700; color: #ffffff; letter-spacing: -0.02em; line-height: 1.15; word-break: keep-all;">
        AI 기반<br>교육 플랫폼 개발
      </h1>
      <p style="font-size: 14pt; color: #b0b0b0; margin-top: 20pt; line-height: 1.6; word-break: keep-all;">
        개인화된 학습 경험과 적응형 교육을 통한<br>미래 교육의 새로운 패러다임
      </p>
    </div>

    <!-- Footer Info -->
    <div style="display: flex; gap: 48pt;">
      <div>
        <p style="font-size: 9pt; color: #666; margin-bottom: 4pt;">Date</p>
        <p style="font-size: 11pt; font-weight: 500; color: #ffffff;">2025. 01</p>
      </div>
      <div>
        <p style="font-size: 9pt; color: #666; margin-bottom: 4pt;">Presenter</p>
        <p style="font-size: 11pt; font-weight: 500; color: #ffffff;">Development Team</p>
      </div>
    </div>
  </div>
</body>
</html>
