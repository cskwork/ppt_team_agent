<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 720pt;
      height: 405pt;
      font-family: 'Pretendard', sans-serif;
      background: #0f0f0f;
      padding: 32pt 48pt;
      display: flex;
      flex-direction: column;
    }
  </style>
</head>
<body>
  <!-- Header -->
  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24pt;">
    <div style="display: flex; align-items: center; gap: 12pt;">
      <p style="display: inline-block; padding: 4pt 10pt; background: #ef4444; color: #fff; border-radius: 4pt; font-size: 8pt; font-weight: 600;">SECTION 02</p>
      <h2 style="font-size: 22pt; font-weight: 600; color: #ffffff; word-break: keep-all;">현재 교육의 한계</h2>
    </div>
    <p style="font-size: 10pt; color: #666;">04</p>
  </div>

  <!-- Problem Cards -->
  <div style="flex: 1; display: grid; grid-template-columns: repeat(4, 1fr); gap: 14pt;">
    <div style="background: linear-gradient(180deg, rgba(239,68,68,0.15) 0%, rgba(239,68,68,0.05) 100%); border-radius: 10pt; padding: 18pt; border: 1px solid rgba(239,68,68,0.3); display: flex; flex-direction: column;">
      <div style="width: 36pt; height: 36pt; background: rgba(239,68,68,0.2); border-radius: 8pt; display: flex; align-items: center; justify-content: center; margin-bottom: 14pt;">
        <p style="font-size: 18pt; color: #ef4444;">1</p>
      </div>
      <h3 style="font-size: 13pt; font-weight: 600; color: #ffffff; margin-bottom: 8pt; word-break: keep-all;">획일화된 커리큘럼</h3>
      <p style="font-size: 10pt; color: #888; line-height: 1.6; word-break: keep-all;">모든 학습자에게 동일한 내용과 속도로 진행되는 수업</p>
    </div>

    <div style="background: linear-gradient(180deg, rgba(249,115,22,0.15) 0%, rgba(249,115,22,0.05) 100%); border-radius: 10pt; padding: 18pt; border: 1px solid rgba(249,115,22,0.3); display: flex; flex-direction: column;">
      <div style="width: 36pt; height: 36pt; background: rgba(249,115,22,0.2); border-radius: 8pt; display: flex; align-items: center; justify-content: center; margin-bottom: 14pt;">
        <p style="font-size: 18pt; color: #f97316;">2</p>
      </div>
      <h3 style="font-size: 13pt; font-weight: 600; color: #ffffff; margin-bottom: 8pt; word-break: keep-all;">지연된 피드백</h3>
      <p style="font-size: 10pt; color: #888; line-height: 1.6; word-break: keep-all;">시험 후 오랜 시간이 지나서야 결과와 피드백 제공</p>
    </div>

    <div style="background: linear-gradient(180deg, rgba(234,179,8,0.15) 0%, rgba(234,179,8,0.05) 100%); border-radius: 10pt; padding: 18pt; border: 1px solid rgba(234,179,8,0.3); display: flex; flex-direction: column;">
      <div style="width: 36pt; height: 36pt; background: rgba(234,179,8,0.2); border-radius: 8pt; display: flex; align-items: center; justify-content: center; margin-bottom: 14pt;">
        <p style="font-size: 18pt; color: #eab308;">3</p>
      </div>
      <h3 style="font-size: 13pt; font-weight: 600; color: #ffffff; margin-bottom: 8pt; word-break: keep-all;">제한된 접근성</h3>
      <p style="font-size: 10pt; color: #888; line-height: 1.6; word-break: keep-all;">시간과 장소에 구애받는 물리적 학습 환경</p>
    </div>

    <div style="background: linear-gradient(180deg, rgba(168,85,247,0.15) 0%, rgba(168,85,247,0.05) 100%); border-radius: 10pt; padding: 18pt; border: 1px solid rgba(168,85,247,0.3); display: flex; flex-direction: column;">
      <div style="width: 36pt; height: 36pt; background: rgba(168,85,247,0.2); border-radius: 8pt; display: flex; align-items: center; justify-content: center; margin-bottom: 14pt;">
        <p style="font-size: 18pt; color: #a855f7;">4</p>
      </div>
      <h3 style="font-size: 13pt; font-weight: 600; color: #ffffff; margin-bottom: 8pt; word-break: keep-all;">교사 과부하</h3>
      <p style="font-size: 10pt; color: #888; line-height: 1.6; word-break: keep-all;">개별 학생 관리의 어려움과 행정 업무 부담</p>
    </div>
  </div>

  <!-- Bottom Stats -->
  <div style="display: flex; gap: 32pt; padding-top: 18pt; border-top: 1px solid rgba(255,255,255,0.1); margin-top: 18pt;">
    <div style="display: flex; align-items: center; gap: 10pt;">
      <p style="font-size: 24pt; font-weight: 700; color: #ef4444;">68%</p>
      <p style="font-size: 10pt; color: #888; line-height: 1.4; word-break: keep-all;">학생들이 현행 교육이<br>자신에게 맞지 않는다고 응답</p>
    </div>
    <div style="display: flex; align-items: center; gap: 10pt;">
      <p style="font-size: 24pt; font-weight: 700; color: #f97316;">45%</p>
      <p style="font-size: 10pt; color: #888; line-height: 1.4; word-break: keep-all;">교사의 업무 시간 중<br>비수업 행정 업무 비율</p>
    </div>
    <div style="display: flex; align-items: center; gap: 10pt;">
      <p style="font-size: 24pt; font-weight: 700; color: #eab308;">30:1</p>
      <p style="font-size: 10pt; color: #888; line-height: 1.4; word-break: keep-all;">평균 교사 대 학생 비율<br>(OECD 평균)</p>
    </div>
  </div>
</body>
</html>
